name: release

# A tag such as v1.0.0-rc.1 builds the production images. The tag must match the VERSION file.
on:
  push:
    tags: ["v*"]

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      # Every base image pinned by digest, and no fake model servers in the production image.
      - run: deploy/scripts/check-digests.sh
      # Fails when Morse's license public key is missing or invalid.
      - run: make -C server check-prod-build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No GO_TAGS: the devlicense build tag is only for development stacks.
      - name: Build and push the server image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build --target prod --build-arg VERSION="$version" -t "$REGISTRY/atlas:$version" server
          docker push "$REGISTRY/atlas:$version"
      - name: Build and push the web image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$REGISTRY/atlas-web:$version" app
          docker push "$REGISTRY/atlas-web:$version"
